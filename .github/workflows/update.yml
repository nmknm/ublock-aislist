name: Update uBlock Origin list

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream list
        run: |
          mkdir -p upstream
          curl -sSfL --retry 3 \
            -o upstream/aislist_blocklist.txt \
            https://raw.githubusercontent.com/Override92/AiSList/main/AiSList/aislist_blocklist.txt

      - name: Convert to uBlock Origin format
        run: python3 -I scripts/convert.py upstream/aislist_blocklist.txt aislist_ublock.txt

      - name: Convert to the compatible format (Brave, AdGuard, ...)
        run: python3 -I scripts/convert.py upstream/aislist_blocklist.txt aislist_compat.txt --compatible

      - name: Commit if changed
        run: |
          if git diff --quiet -- aislist_ublock.txt aislist_compat.txt; then
            echo "No changes upstream."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aislist_ublock.txt aislist_compat.txt
          git commit -m "Update list from upstream"
          git push
